# openspec/config.yaml
# Project-specific SDD configuration. Generated by sdd-init; safe to edit by hand.
#
# NOTE: the shape below is deliberately valid YAML. The generic template shipped with the
# sdd-init skill mixes block sequences with mapping keys at the same indent level (e.g. a
# `- rule` list followed by `tdd: true`), which does not parse. Sections that downstream
# phases read as keys (`verify.test_command`, `verify.build_command`, `apply.tdd`) are
# therefore written as mappings, with their prose rules under an `instructions` list.
schema: spec-driven

context: |
  Stack: FastAPI + SQLAlchemy 2 async (aiosqlite) + Alembic + pydantic 2.8; React + TS + Vite 5.
    Packaged with PyInstaller 6 (one-dir, console window) through riguel.spec.
  Architecture: single server. The backend serves the API and the built frontend (frontend/dist)
    through /assets plus a catch-all returning index.html; api/ and imagenes/ never fall through.
    Frozen, the entry point is backend/app/core/launcher.py, and every location resolves through
    backend/app/core/paths.py: bundle_root() for read-only resources inside the build, app_dir() and
    writable_paths() for state that lives next to the executable in data/.
  Distribution: two artifacts out of one script. instalar.bat + arrancar.bat over a repo-root .venv
    (needs Python on the target machine), and the PyInstaller folder `Riguel/` (needs nothing).
    empaquetar.ps1 builds the zip and VERIFIES it from scratch in a temp folder; -ConExe adds the
    executable stage and verifies that too. Both are first-class tests, not builds.
  Python: 3.12, 3.13 or 3.14. Older and newer versions are rejected on purpose: pydantic-core
    (compiled) only publishes wheels for the versions instalar.bat accepts.
  Style: no linter, no formatter; mypy (backend) and tsc -b (frontend). Conventional commits
    straight to main, written in Spanish without accents. Prose docs in Spanish (voseo); structured
    SDD artifacts and code comments in English. .bat/.cmd/.ps1 MUST stay CRLF (LF breaks goto in
    cmd.exe, and PowerShell scripts rely on the same rule).

strict_tdd: true

testing:
  runner: pytest
  capabilities:
    unit: 'available (pytest on the backend; vitest on the frontend)'
    integration: 'available (pytest + httpx ASGITransport against the real FastAPI app)'
    e2e: 'available (custom CDP driver on Node 22: frontend/e2e/logo-asociacion.mjs)'
    coverage: 'NOT available (no pytest-cov, no vitest coverage provider)'
    linter: 'NOT available'
    type_checker: 'available (mypy on the backend, tsc -b on the frontend)'
    formatter: 'NOT available'
  commands:
    backend_tests: 'cd backend && ..\.venv\Scripts\python.exe -m pytest'
    backend_expected: '58 passed, 2 skipped (the 2 skips are pre-existing async tests missing @pytest.mark.asyncio)'
    frontend_tests: 'cd frontend && npm test -- --run'
    frontend_expected: '22 passed'
    e2e: 'cd frontend && npm run e2e'
    e2e_requires: 'a server on :8000 (override with E2E_BASE_URL), Chrome or Edge, Node 22+'
    package_and_verify: 'pwsh -NoProfile -ExecutionPolicy Bypass -File empaquetar.ps1'
    package_requires: 'port 8000 free, npm available'
    exe_and_verify: 'pwsh -NoProfile -ExecutionPolicy Bypass -File empaquetar.ps1 -ConExe'
    exe_requires: 'the above, plus PyInstaller in .venv and port 8412 free'

rules:
  proposal:
    - State the rollback plan for anything that changes how users install or where their data lives
    - List affected files, not just modules, so a reviewer can verify intent from the diff
  specs:
    - Use Given/When/Then scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Record architecture decisions with rationale AND the alternative that was rejected
    - Explicitly call out anything that behaves differently when frozen (sys.frozen, sys._MEIPASS)
  tasks:
    - Group tasks by phase, hierarchical numbering
    - Keep tasks completable in one session
  apply:
    instructions:
      - Follow existing code patterns and conventions
      - 'Strict TDD scope: pure Python logic MUST be written test-first with pytest'
      - 'Packaging artifacts (PyInstaller .spec, .ps1, .bat) are NOT unit-testable. Verify them by
        running the packaged artifact, never with a unit test'
    tdd: true
    test_command: 'cd backend && ..\.venv\Scripts\python.exe -m pytest'
  verify:
    instructions:
      - Compare the implementation against every spec scenario
      - Run the backend tests AND the packaged-artifact check (empaquetar.ps1) end to end
    test_command: 'cd backend && ..\.venv\Scripts\python.exe -m pytest'
    build_command: 'cd frontend && npm run build'
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
